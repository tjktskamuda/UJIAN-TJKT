<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e9eef7">
  <title>Admin · Ujian Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Halaman Admin: login → dashboard (SPA). Password TIDAK pernah ada di halaman ini. -->
  <div id="app">
    <section class="a-login" id="login-view">
      <div class="card">
        <div style="text-align:center;margin-bottom:18px">
          <div class="logo" id="l-logo"></div>
          <div class="muted small" id="l-school" style="font-weight:700"></div>
          <h1 style="font-size:1.35rem;margin-top:4px">Admin <span id="l-app">Sistem Ujian Online</span></h1>
        </div>
        <form id="login-form" class="stack" novalidate>
          <div class="field">
            <label for="l-pw">Password Admin</label>
            <input id="l-pw" class="input" type="password" autocomplete="current-password" required>
          </div>
          <div id="l-err" class="err-text" role="alert" hidden></div>
          <button class="btn btn-primary btn-block" type="submit" id="l-btn">Masuk</button>
          <a class="small muted" id="l-student" href="#" style="text-align:center;padding:8px">← Ke halaman siswa</a>
        </form>
      </div>
    </section>

    <!-- Dashboard.html — Kerangka dashboard admin: sidebar (desktop) / hamburger (mobile) -->
    <div class="a-shell" id="shell" hidden>
      <div class="a-overlay" id="a-overlay"></div>
      <aside class="a-side" id="a-side" aria-label="Menu admin">
        <div class="a-brand">
          <div class="logo" id="a-logo"></div>
          <div style="min-width:0">
            <b id="a-app">SISTEM UJIAN ONLINE</b>
            <span id="a-school"></span>
          </div>
        </div>
        <nav class="a-nav" id="a-nav"></nav>
        <div class="a-side-foot">
          <button type="button" class="btn btn-outline btn-block btn-sm" id="btn-logout">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>Logout
          </button>
        </div>
      </aside>
    
      <div class="a-main">
        <header class="a-top">
          <button type="button" class="btn btn-ghost btn-icon" id="btn-menu" aria-label="Buka menu" aria-controls="a-side">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <b id="a-top-title">Ringkasan</b>
        </header>
        <main class="a-content" id="content" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <!-- ImportView.html — Template halaman Import Soal (dirender oleh AdminJavaScript) -->
  <template id="tpl-import">
    <div class="a-head">
      <div>
        <h2>Import Soal</h2>
        <p>Unggah template CSV/XLSX, periksa pratinjau & error, lalu import soal yang valid.</p>
      </div>
    </div>
  
    <div class="steps">
      <section class="card step">
        <div class="step-h"><span class="step-n">1</span>Unduh template</div>
        <p class="small muted">Isi satu baris per soal. Kolom: No, Mapel, Kelas, Kategori, Tipe_Soal, Pertanyaan, Gambar_URL, Pilihan_A–E, Jawaban_Benar, Bobot, Pembahasan.</p>
        <div class="row wrap mt-2">
          <button type="button" class="btn btn-soft" id="imp-tpl-xlsx">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>Template XLSX</button>
          <button type="button" class="btn btn-outline" id="imp-tpl-csv">Template CSV</button>
        </div>
        <ul class="small muted mt-2" id="imp-notes" style="padding-left:18px;margin-bottom:0"></ul>
      </section>
  
      <section class="card step">
        <div class="step-h"><span class="step-n">2</span>Unggah file soal</div>
        <label class="dropzone" id="imp-drop">
          <input type="file" id="imp-file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;color:var(--brand)"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg>
          <div style="font-weight:700;margin-top:6px">Ketuk untuk memilih file</div>
          <div class="small muted">CSV atau XLSX · maks. 2.000 soal</div>
          <div class="small mt-1" id="imp-fname"></div>
        </label>
        <label class="switch mt-2">
          <span><span class="s-text">Periksa gambar dapat diakses</span><span class="s-sub">Lebih lambat, tetapi mendeteksi gambar rusak/privat</span></span>
          <input type="checkbox" id="imp-check-img" checked><span class="track"></span>
        </label>
      </section>
  
      <section class="card step" id="imp-result" hidden>
        <div class="step-h"><span class="step-n">3</span>Pratinjau sebelum import</div>
        <div class="sum-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="card"><b id="imp-total">0</b><span>Soal ditemukan</span></div>
          <div class="card"><b id="imp-valid" style="color:var(--ok)">0</b><span>Soal valid</span></div>
          <div class="card"><b id="imp-invalid" style="color:var(--danger)">0</b><span>Bermasalah</span></div>
        </div>
        <div id="imp-errors-wrap" hidden>
          <div class="label mt-1">Daftar error</div>
          <div class="err-list mt-1" id="imp-errors"></div>
        </div>
        <div class="label mt-2">Pratinjau soal valid <span class="muted small" id="imp-prev-note"></span></div>
        <div class="tbl-wrap mt-1 card" style="max-height:420px">
          <table class="tbl resp" id="imp-preview"></table>
        </div>
        <div class="row wrap mt-2">
          <button type="button" class="btn btn-success" id="imp-do">IMPORT SOAL VALID</button>
          <button type="button" class="btn btn-outline" id="imp-cancel">BATAL</button>
        </div>
      </section>
  
      <section class="card step">
        <div class="step-h"><span class="step-n">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>Upload gambar soal</div>
        <p class="small muted">Gambar disimpan di folder Google Drive <b>BANK_SOAL_IMAGES</b>. Salin URL yang dihasilkan ke kolom <b>Gambar_URL</b> pada template. PNG/JPG/GIF/WEBP, maks. 2 MB.</p>
        <div class="row wrap mt-2">
          <label class="btn btn-soft">
            <input type="file" id="img-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
            Pilih gambar
          </label>
          <span class="small muted" id="img-info"></span>
        </div>
        <div id="img-out" class="mt-2" hidden>
          <img class="img-preview" id="img-prev" alt="Pratinjau gambar">
          <code class="url mt-1" id="img-url"></code>
          <div class="row wrap mt-1">
            <button type="button" class="btn btn-primary btn-sm" id="img-upload">Upload ke Drive</button>
            <button type="button" class="btn btn-outline btn-sm" id="img-copy" hidden>Salin URL</button>
          </div>
        </div>
      </section>
    </div>
  </template>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
